[package]
name = "obk"
version = "0.1.1"
edition = "2021"
description = "gh CLI shim that routes read commands through octobroker"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde_json = "1.0"
# `obk mcp` IAM auth: ambient AWS credentials (ECS task role / EKS IRSA)
aws-config = { version = "1.8", default-features = false, features = ["rustls", "rt-tokio", "client-hyper", "behavior-version-latest"] }
aws-credential-types = "1"
tokio = { version = "1", features = ["rt"] }
sha2 = "0.10"
